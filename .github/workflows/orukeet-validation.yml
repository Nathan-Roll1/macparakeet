name: Orukeet full app validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 610c18f45cc2b9b5b81ee3cc09c28fac1e23b4b9
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: validation-tools
          sparse-checkout: .validation-tools
      - name: Reproduce model-switch interleaving before and after the fix
        run: python3 validation-tools/.validation-tools/macparakeet-switch-regression.py "$PWD" "$PWD/evidence"
      - name: Record source and toolchain
        run: |
          mkdir -p evidence fixtures
          git rev-parse HEAD | tee evidence/source-head.txt
          xcodebuild -version | tee evidence/xcode-version.txt
          swift --version | tee evidence/swift-version.txt
          for name in en de fr silence; do
            curl --fail --retry 3 --location "https://raw.githubusercontent.com/Nathan-Roll1/muesli/5f03f1e/.validation-fixtures/$name.wav" -o "fixtures/$name.wav"
          done
      - name: Lint the new model files
        run: xcrun swift-format lint --configuration .swift-format Sources/MacParakeetCore/STT/OrukeetModelStore.swift Tests/MacParakeetTests/STT/OrukeetModelStoreTests.swift
      - name: Focused installer and real scheduler regressions
        shell: bash
        run: |
          set -euo pipefail
          ORUKEET_AUDIO_DIR="$PWD/fixtures" MACPARAKEET_DEBUG_APP_STATE_DIR="$PWD/runtime-cache" swift test --filter 'OrukeetModelStoreTests|ParakeetTDTASRConfigTests|SpecCommandTests|STTRuntimeInferenceGatingTests|SpeechEnginePreferenceTests' | tee evidence/focused-tests.log
      - name: Full test suite (one final pass)
        shell: bash
        run: |
          set -euo pipefail
          MACPARAKEET_DEBUG_APP_STATE_DIR="$PWD/full-suite-cache" swift test --skip-build | tee evidence/full-tests.log
      - name: Build actual development app with the repository script
        shell: bash
        run: |
          set -euo pipefail
          MACPARAKEET_DEBUG_APP_STATE_DIR="$PWD/gui-cache" scripts/dev/run_app.sh | tee evidence/xcode-build.log
          cp "${TMPDIR:-/tmp}/macparakeet-dev-build.log" evidence/xcode-build-details.log
          ditto -c -k --sequesterRsrc --keepParent .build/xcode-dev/Build/Products/Debug/MacParakeet-Dev.app evidence/MacParakeet-Dev.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MacParakeet-orukeet-validation
          path: evidence/
          retention-days: 14
